server {
    listen 80;
    
    # Maneja todas las solicitudes (incluyendo las imágenes y archivos estáticos de React)
    location / {
        root /usr/share/nginx/html;
        # Esto es vital para las rutas de React (ej: /productos)
        try_files $uri $uri/ /index.html; 
    }

    # Proxy para redirigir las llamadas API al Backend de Spring Boot
    # Usamos 'backend' como nombre del servicio en la red Docker Compose
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Manejo de errores (opcional)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}